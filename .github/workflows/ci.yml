# Kiểm tra mỗi lần push / PR: lint, typecheck, unit test (PGlite trong bộ nhớ), dữ liệu đề, build.
# Không cần secret: build không kết nối CSDL, media (Data/) không có trên GitHub → --skip-media.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test
      - run: python3 scripts/check_content.py --skip-media
      - run: npm run build
